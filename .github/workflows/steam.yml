name: Steam sync

on:
  schedule:
    - cron: "23 2 * * 1"   # Mondays, 6:23 am Dubai time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam
  cancel-in-progress: true

jobs:
  steam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Steam library
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/steam_sync.py
      - name: Save it to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update Steam playtime"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
