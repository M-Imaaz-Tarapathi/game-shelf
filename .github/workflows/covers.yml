name: Fetch covers

on:
  push:
    branches: [main]
    paths: ["data/games.json", "data/overrides.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download missing covers from IGDB
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/fetch_covers.py
      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers data/covers_report.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Add game covers"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
